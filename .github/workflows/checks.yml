# Lint, unit tests and build on every push. The end-to-end tests stay local
# (`node scripts/local-e2e.mjs`): they need Edge and the Linkkit and
# Boardkit checkouts.
name: checks

on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
