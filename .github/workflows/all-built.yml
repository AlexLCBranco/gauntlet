name: all-built
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/all-built.mjs
        env:
          # A fine-grained token with Contents: read on the private repos (rotationkit). Without it, private repos are skipped.
          GH_TOKEN: ${{ secrets.ALL_BUILT_TOKEN || github.token }}
      - run: |
          git diff --quiet ALL_BUILT.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
          git add ALL_BUILT.md
          git commit -m "ALL_BUILT.md: daily merge of every repo's BUILT.md"
          git push
