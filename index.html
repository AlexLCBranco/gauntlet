<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet</title>
  <style>
    :root { color-scheme: dark; --bg: #111; --fg: #e6e6e6; --muted: #888; --link: #8ab4f8; }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 8px 0; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Gauntlet</h1>
    <p>My apps.</p>
    <ul>
      <!-- One line per app. Add its forwarding rules to vercel.json too. -->
      <li><a href="/boardkit/">Boardkit</a></li>
    </ul>
  </main>
</body>
</html>
